name: Build and Release

on:
  push:
    branches: [main, master, develop, 'codex/**']
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

# 同一 ref 连推多次时取消上一轮，避免重复构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release authorization before producing cloud artifacts
        if: github.event_name == 'release'
        run: python scripts/check_release_readiness.py
      - name: Require an experimental prerelease
        if: github.event_name == 'release'
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: test "$PRERELEASE" = "true"

  build-windows:
    needs: publication-check
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -r requirements.txt

      - name: Build executable
        run: python scripts/build.py

      # 仅发版时上传制品；push / PR 只做编译验证，不占 Actions 存储
      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: IP-Suite-Tool-Windows-py${{ matrix.python-version }}
          path: bin/IP-Suite-Tool.exe
          retention-days: 7
          if-no-files-found: error

  build-linux:
    needs: publication-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -r requirements.txt

      - name: Build executable
        run: python scripts/build.py

      # 仅发版时上传制品；push / PR 只做编译验证，不占 Actions 存储
      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: IP-Suite-Tool-Linux-py${{ matrix.python-version }}
          path: bin/IP-Suite-Tool
          retention-days: 7
          if-no-files-found: error

  build-macos:
    needs: publication-check
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -r requirements.txt

      - name: Build executable
        run: python scripts/build.py

      # 仅发版时上传制品；push / PR 只做编译验证，不占 Actions 存储
      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: IP-Suite-Tool-macOS-py${{ matrix.python-version }}
          path: bin/IP-Suite-Tool
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify publication authorization and old-repository disposition
        run: python scripts/check_release_readiness.py

      - name: Require an experimental prerelease
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: test "$PRERELEASE" = "true"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
